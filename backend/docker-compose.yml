version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayscript_postgres
    environment:
      POSTGRES_USER: dayscript
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: dayscript_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayscript"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching (optional, for later)
  # redis:
  #   image: redis:7-alpine
  #   container_name: dayscript_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
